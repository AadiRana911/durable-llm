# Local Postgres for durable-llm. Nothing else is required to run this project.
#
# Fixed project name so `docker compose exec db ...` and the named volume resolve the same
# way no matter what the checkout directory is called.
name: durable-llm

services:
  db:
    image: postgres:17
    container_name: durable-llm-db
    environment:
      POSTGRES_USER: durable_llm
      # Overridable so the credential is not hardcoded in a tracked file, but it still
      # defaults to `durable_llm` because two other tracked files spell that password out: the
      # DURABLE_LLM_DATABASE_URL in .env.example, and the fallback of the same name in the
      # Makefile that applies whenever there is no .env to override it. Setting
      # POSTGRES_PASSWORD without fixing whichever of those your setup actually uses leaves
      # every command authenticating with the old credential, so change them together.
      #
      # Also note Postgres reads this only while initialising an empty data directory, and
      # pgdata below is a named volume that survives `docker compose down`. On a checkout
      # that has already run once, a new password here is silently ignored and the original
      # one stays in force until the volume is dropped (`docker compose down -v`).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-durable_llm}
      POSTGRES_DB: durable_llm
      # Deterministic collation so ORDER BY in `runs list` sorts identically everywhere.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Host 55432 on purpose: a developer machine very often already has 5432 in use.
      #
      # Bound to 127.0.0.1 rather than the default all-interfaces bind. This database
      # stores every prompt and every response in cleartext, and the credentials above
      # are a published default that anyone reading this repo already knows. Without the
      # explicit host, a laptop joined to a café or conference network is serving its
      # entire prompt history to that network. Loopback keeps it reachable from the
      # developer's own tools and from nowhere else.
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 matters: during first-boot initdb the entrypoint runs a temporary
      # server on the unix socket only, so a socket-based probe reports "ready" before the
      # database is actually accepting client connections.
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -p 5432 -U durable_llm -d durable_llm"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  pgdata:
    name: durable-llm-pgdata
